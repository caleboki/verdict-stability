# Experiment configuration. Edit model IDs before running.
# A provider is skipped if its model list is empty.

[run]
runs_per_condition = 20       # independent fresh calls per (model, condition, meal)
max_workers = 4               # concurrent requests per provider
max_tokens = 1024
output = "results/raw.jsonl"

# "default" sends no temperature (the provider's default sampling).
# "t0" sends temperature = 0. If a model rejects temperature, the call is
# recorded as unsupported rather than silently changed.
conditions = ["default", "t0"]

[analysis]
# Scores of 50 or more count as "suitable", 49 or less as "not suitable".
threshold = 49.5
verdict_label = "suitable"
# Each older model next to its replacement, for the generation shift table.
generation_pairs = [
    ["claude-sonnet-4-6", "claude-sonnet-5-5"],
    ["claude-haiku-4-5-20251001", "claude-haiku-5-5"],
]

[prompt]
template = """On a scale of 0 to 100, how suitable is {meal} for someone managing gallstones?

Briefly explain your reasoning, then end your answer with a final line in exactly this format, where N is a whole number from 0 to 100:
Score: N"""

# Previous generation next to its current replacement, so the analysis can
# compare how stable each generation's verdicts are.
[providers.anthropic]
models = ["claude-sonnet-4-6", "claude-sonnet-5-5", "claude-haiku-4-5-20251001", "claude-haiku-5-5"]

[providers.openai]
models = []   # e.g. fill in a current OpenAI model ID

[providers.google]
models = []   # e.g. fill in a current Gemini model ID

# Meals and their categories are fixed BEFORE any data is collected,
# so "borderline" is a prediction being tested, not a label fitted afterwards.
